server {
    listen 80;
    listen [::]:80;
    server_name duecue.jane-zz.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/duecue-acme;
        try_files $uri =404;
    }
    location / {
        return 301 https://duecue.jane-zz.online$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name duecue.jane-zz.online;

    ssl_certificate /etc/letsencrypt/live/duecue.jane-zz.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/duecue.jane-zz.online/privkey.pem;
    client_max_body_size 10m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header OAI-Authenticated-User-Id "";
        proxy_read_timeout 320s;
        proxy_buffering off;
    }
}
