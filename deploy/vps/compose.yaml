name: duecue
services:
  app:
    image: node:24-bookworm-slim@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54
    user: node
    init: true
    working_dir: /app
    command: ["node", "main.mjs"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    env_file: /etc/duecue/app.env
    environment:
      NODE_ENV: production
      PUBLIC_ORIGIN: https://duecue.jane-zz.online
      BIND_ADDRESS: 0.0.0.0
      PORT: "3000"
      DUECUE_DATA: /data
      SCREENSHOT_MODEL_URL: http://screenshot-model:8080/v1/chat/completions
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./main.mjs:/app/main.mjs:ro
      - ./card-requests.mjs:/app/card-requests.mjs:ro
      - ./accounts.mjs:/app/accounts.mjs:ro
      - ./redemption.mjs:/app/redemption.mjs:ro
      - ./bindings.mjs:/app/bindings.mjs:ro
      - ./package.json:/app/package.json:ro
      - ./schema.sql:/app/schema.sql:ro
      - ./dist:/app/dist:ro
      - /var/lib/duecue:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  card-model:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:5b43086e3ba7ea5794d72904654f6cd41224a9b1c6ac0398f4940ee380d30f23
    user: "65534:65534"
    command: ["-m", "/models/qwen2.5-1.5b-instruct-q4_k_m.gguf", "--alias", "card-analysis", "--host", "0.0.0.0", "--port", "8080", "-c", "2048", "-t", "2", "-tb", "2", "-np", "1"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    cpus: 2
    mem_limit: 3g
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/lib/duecue-models:/models:ro

  screenshot-model:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:5b43086e3ba7ea5794d72904654f6cd41224a9b1c6ac0398f4940ee380d30f23
    user: "65534:65534"
    command: ["-m", "/models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf", "--alias", "screenshot-analysis", "--host", "0.0.0.0", "--port", "8080", "-c", "8192", "-t", "3", "-tb", "3", "-np", "1", "-ctk", "q8_0", "--no-context-shift"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    cpus: 3
    mem_limit: 4500m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/lib/duecue-models:/models:ro
